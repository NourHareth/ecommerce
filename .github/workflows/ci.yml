name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  user-service:
    name: UserService (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore, build, test
        run: |
          dotnet restore src/AmCart.sln
          dotnet build src/AmCart.sln -c Release --no-restore
          dotnet test src/AmCart.sln -c Release --no-build --verbosity normal

  ui-app:
    name: ui-app (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontends/ui-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/Frontends/ui-app/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build

  dockerfile-smoke:
    name: Docker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build UserService image
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Services/UserService/Dockerfile
          push: false
          tags: user-service:ci

      - name: Build ProductService image
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Services/ProductService/Dockerfile
          push: false
          load: true
          tags: product-service:ci

      - name: Verify ProductService runtime hardening
        run: |
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1654,gid=1654 \
            --memory=512m \
            --cpus=1.0 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --entrypoint sh product-service:ci -c '
              test "$(id -u)" -ne 0 &&
              grep -Eq "^CapEff:[[:space:]]+0+$" /proc/self/status &&
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status &&
              touch /tmp/test-write &&
              rm /tmp/test-write &&
              if touch /app/test-write 2>/dev/null; then
                echo APP_WRITABLE_UNEXPECTED
                exit 1
              else
                echo PRODUCT_SERVICE_HARDENING_OK
              fi
            '

      - name: Build UI image
        uses: docker/build-push-action@v6
        with:
          context: src/Frontends/ui-app
          file: src/Frontends/ui-app/Dockerfile
          push: false
          tags: ui:ci

  security-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-report.json
          exit-code: '0'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-vulnerability-report
          path: trivy-report.json
          retention-days: 30

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
