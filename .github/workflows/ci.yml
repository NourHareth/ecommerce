name: CI

# Blocking policy: docs/security/03-politique-de-blocage.md
# Every job named "Security · ..." can fail the build. `security-gate` succeeds only
# if all of them pass, and later stages (deploy, DAST) depend on it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly full run on main, DAST included: new CVEs appear without any code change.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: v0.76.2
  SEMGREP_IMAGE: semgrep/semgrep:1.186.0
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  # Read by every Trivy step. YAML format = exceptions scoped by path, with expiry and justification.
  TRIVY_IGNOREFILE: .trivyignore.yaml

jobs:
  # ------------------------------------------------------------------ plan
  # DAST (about 16 min on a kind cluster) is by far the costliest job, and GitHub pauses Actions on
  # forks that use too much. It runs on every PR that changes more than documentation, on the weekly
  # schedule and on demand. It is skipped on a push to main (the PR that produced the merge already ran
  # it) and on documentation-only PRs (they cannot change the application).
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      run_dast: ${{ steps.decide.outputs.run_dast }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          case "$EVENT" in
            push) run=false ;;
            pull_request)
              # Not piped: a failing git diff must fail the job (fail closed), not skip DAST.
              git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
              cat "$RUNNER_TEMP/changed.txt"
              if ! grep -qvE '^docs/|\.md$' "$RUNNER_TEMP/changed.txt"; then run=false; fi ;;
          esac
          echo "run_dast=$run" | tee -a "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ build & tests
  dotnet:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore src/AmCart.sln --locked-mode
      - run: dotnet build src/AmCart.sln -c Release --no-restore
      - run: dotnet test src/AmCart.sln -c Release --no-build

  ui:
    name: Build (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontends/ui-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/Frontends/ui-app/package-lock.json
      - run: npm ci
      - run: npm run build

  # ------------------------------------------------------------------ security stage
  sast:
    name: "Security · SAST (Semgrep)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Full report (all severities, informational)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config p/csharp --config p/typescript --config p/react --config .semgrep/ \
            --metrics off --sarif --output semgrep.sarif
      - name: Gate (fails on ERROR findings)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --config p/csharp --config p/typescript --config p/react --config .semgrep/ \
            --metrics off --severity ERROR --error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif
          retention-days: 30

  sca:
    name: "Security · Dependencies (Trivy fs)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Full report (JSON, informational)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: json
          output: trivy-sca.json
          exit-code: "0"
      - name: Gate (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-sca-report
          path: trivy-sca.json
          retention-days: 30

  secrets:
    name: "Security · Secrets (Gitleaks, full history)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks over every commit, values redacted
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner \
            --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 30

  iac:
    name: "Security · IaC (Trivy config)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gate (fails on HIGH/CRITICAL misconfigurations)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

  images:
    name: "Security · Image ${{ matrix.name }} (Trivy image)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: user-service
            context: src
            file: src/Services/UserService/Dockerfile
          - name: product-service
            context: src
            file: src/Services/ProductService/Dockerfile
          - name: ui
            context: src/Frontends/ui-app
            file: src/Frontends/ui-app/Dockerfile
    env:
      IMAGE: amcart/${{ matrix.name }}:${{ github.sha }}
      TRIVY_SECRET_CONFIG: trivy-secret.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}
      - name: Gate (fails on fixable HIGH/CRITICAL CVEs or any embedded secret)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      # The gates below run even if the CVE gate failed, so every result is reported.
      - name: Gate (image must not run as root)
        if: always() && steps.build.outcome == 'success'
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          echo "Configured user: '${user:-<none, defaults to root>}'"
          case "$user" in
            ""|root|0|0:*|root:*) echo "::error::$IMAGE runs as root"; exit 1 ;;
          esac
      - name: Verify runtime hardening (.NET services)
        if: always() && steps.build.outcome == 'success' && matrix.name != 'ui'
        run: |
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1654,gid=1654 \
            --memory=512m --cpus=1.0 --cap-drop ALL --security-opt no-new-privileges:true \
            --entrypoint sh "$IMAGE" -c '
              test "$(id -u)" -ne 0 &&
              grep -Eq "^CapEff:[[:space:]]+0+$" /proc/self/status &&
              grep -Eq "^NoNewPrivs:[[:space:]]+1$" /proc/self/status &&
              touch /tmp/probe && rm /tmp/probe &&
              if touch /app/probe 2>/dev/null; then echo "::error::/app is writable"; exit 1; fi &&
              echo RUNTIME_HARDENING_OK'
      - name: Verify runtime hardening (UI serves the SPA as non-root, read-only)
        if: always() && steps.build.outcome == 'success' && matrix.name == 'ui'
        run: |
          # Backends are not running here; map their DNS names so nginx can start.
          docker run -d --name ui --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --add-host user-service.amcart-services.svc.cluster.local:127.0.0.1 \
            --add-host product-service.amcart-services.svc.cluster.local:127.0.0.1 \
            -p 8080:8080 "$IMAGE"
          trap 'docker logs ui; docker rm -f ui >/dev/null' EXIT
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "200"
          curl -sI http://localhost:8080/ | grep -qi '^content-security-policy:'
          test "$(docker exec ui id -u)" != "0"
          echo UI_RUNTIME_HARDENING_OK

  # ------------------------------------------------------------------ dynamic testing
  # Deploys the build into a DISPOSABLE kind cluster on the runner (same hardened manifests as the
  # VM, DAST overlay), then runs authenticated tests against the live app. It needs only the builds:
  # testing a vulnerable build in a throwaway environment is the point. Promotion is decided by
  # security-gate, which needs DAST AND the static controls.
  dast:
    name: "Security · DAST (ZAP + business logic)"
    needs: [plan, dotnet, ui]
    if: needs.plan.outputs.run_dast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUT_DIR: ${{ github.workspace }}/dast-out
      BASE_URL: http://127.0.0.1:8080
      ZAP_IMAGE: zaproxy/zap-stable:2.17.0
    steps:
      - uses: actions/checkout@v7
      - name: Create disposable kind cluster (Kubernetes v1.37.0)
        uses: helm/kind-action@v1.15.2
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          cluster_name: amcart
      - name: Deploy (hardened manifests + DAST overlay, fresh secrets)
        id: deploy
        env:
          CLUSTER: kind
          PROFILE: amcart
          OVERLAY: dast
          SECRETS_FILE: ${{ runner.temp }}/amcart-secrets.env
        run: deploy/scripts/deploy.sh
      - name: Expose the gateway on the runner
        run: |
          kubectl -n amcart-web port-forward svc/ui 8080:8080 > "$RUNNER_TEMP/pf.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS "$BASE_URL/healthz" >/dev/null && break; sleep 1; done
          curl -fsS -o /dev/null "$BASE_URL/api/v1/products"
      - name: Seed test data (random credentials, disposable)
        id: seed
        run: tests/dast/seed.sh
      - name: Business-logic checks (F2 order ownership, F3 server-side price)
        id: logic
        run: tests/dast/business-logic.sh
      - name: ZAP authenticated API scan (fails on High)
        id: zap
        if: always() && steps.seed.outcome == 'success'
        run: tests/dast/zap-scan.sh
      - name: Summary
        if: always()
        run: |
          for f in business-logic.md zap-summary.md; do
            if [ -f "$OUT_DIR/$f" ]; then cat "$OUT_DIR/$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dast-reports
          path: |
            dast-out/*.md
            dast-out/*.html
            dast-out/*.json
            !dast-out/seed.env
          retention-days: 30

  # ------------------------------------------------------------------ gate
  # `if: always()` matters: without it, a failed control makes this job SKIPPED, and GitHub reports a
  # skipped job as a success, so a required "Security gate" check would let the PR merge anyway.
  # The job therefore always runs and checks each result itself.
  security-gate:
    name: Security gate
    needs: [plan, dotnet, ui, sast, sca, secrets, iac, images, dast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every blocking control must have passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_DAST: ${{ needs.plan.outputs.run_dast }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          # The only accepted non-success: DAST skipped because the plan decided not to run it.
          failed="$(echo "$NEEDS" | jq -r --arg rd "$RUN_DAST" '
            to_entries[]
            | select(.value.result != "success")
            | select((.key == "dast" and .value.result == "skipped" and $rd == "false") | not)
            | .key')"
          if [ -n "$failed" ]; then
            echo "::error::Blocking controls not passed: $(printf '%s' "$failed" | tr '\n' ' ')"
            exit 1
          fi
          echo "All blocking security controls passed for $GITHUB_SHA (DAST run: $RUN_DAST)."
