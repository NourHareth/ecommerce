# Loki 3.7, single binary, no multi-tenancy (tenant "fake").
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h          # 7 days: enough to investigate an incident in this lab
  allow_structured_metadata: true
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Detection (section 4.7): Prometheus-style alerting rules written in LogQL, read from
# /etc/loki/rules/<tenant>/. No Alertmanager in this lab: firing alerts are visible in Grafana
# (Alerting > Alert rules) and through /prometheus/api/v1/alerts.
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /tmp/loki-rules
  enable_api: true
  evaluation_interval: 15s

analytics:
  reporting_enabled: false
