# UserService: authentication, JWT issuing, profiles. Secret `user-service-secret`
# (connection string + JWT key) is generated at deploy time, never committed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service
  namespace: amcart-services
automountServiceAccountToken: false   # the app never calls the Kubernetes API
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: amcart-services
  labels:
    app: user-service
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  App__BaseUrl: http://localhost:8080
  ProductService__BaseUrl: http://product-service.amcart-services.svc.cluster.local:8080
  # Structured logs (section 4.7): one JSON object per line, UTC timestamp, scopes (CorrelationId).
  Logging__Console__FormatterName: json
  Logging__Console__FormatterOptions__IncludeScopes: "true"
  Logging__Console__FormatterOptions__UseUtcTimestamp: "true"
  Logging__Console__FormatterOptions__TimestampFormat: "yyyy-MM-ddTHH:mm:ss.fffZ"
  Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning   # one SQL line per query: noise
  DOTNET_EnableDiagnostics: "0"           # no debugger/profiler IPC endpoints
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: amcart-services
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      serviceAccountName: user-service
      automountServiceAccountToken: false
      dnsConfig:
        options:
          - { name: ndots, value: "2" }   # see deploy/README.md "DNS": FQDNs resolved directly
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654        # "app" user of the .NET images
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: user-service
          image: amcart/user-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: user-service-config
            - secretRef:
                name: user-service-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          startupProbe:          # EF Core migrations run at startup
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3    # /health includes a database round trip
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:         # TCP only: a database outage must not restart the app
            tcpSocket: { port: http }
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: amcart-services
  labels:
    app: user-service
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: 8080
      targetPort: http
