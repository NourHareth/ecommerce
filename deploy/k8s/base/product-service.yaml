# ProductService: catalog, cart, checkout, orders. Secret `product-service-secret`
# (connection string + JWT key) is generated at deploy time, never committed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-service
  namespace: amcart-services
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: product-service-config
  namespace: amcart-services
  labels:
    app: product-service
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  Logging__Console__FormatterName: json
  DOTNET_EnableDiagnostics: "0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: amcart-services
  labels:
    app: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      serviceAccountName: product-service
      automountServiceAccountToken: false
      dnsConfig:
        options:
          - { name: ndots, value: "2" }   # see deploy/README.md "DNS": FQDNs resolved directly
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: product-service
          image: amcart/product-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: product-service-config
            - secretRef:
                name: product-service-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: amcart-services
  labels:
    app: product-service
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 8080
      targetPort: http
