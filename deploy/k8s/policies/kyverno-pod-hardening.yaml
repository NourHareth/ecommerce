# Admission control (section 4.5): a workload that is not hardened is REJECTED in the AmCart namespaces.
#
# Two layers:
#  1. Pod Security Admission "restricted" (namespace labels, deploy/k8s/base/namespaces.yaml):
#     built into the API server; blocks root, privileged pods, added capabilities, host namespaces.
#  2. This Kyverno policy (Kyverno v1.20, CEL-based ValidatingPolicy) adds what PSA does not check:
#     read-only root filesystem, pinned image tags, resource limits, no service-account token.
#
# failurePolicy: Fail -> if Kyverno is unavailable, AmCart pods are refused rather than admitted
# unchecked (fail closed). Only namespaces labelled app.kubernetes.io/part-of=amcart are affected,
# so the cluster's own components keep working.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: amcart-pod-hardening
  annotations:
    policies.kyverno.io/title: AmCart pod hardening
    policies.kyverno.io/description: >-
      Pods in AmCart namespaces must run as non-root with no privilege escalation, drop all
      capabilities, use a read-only root filesystem, pin image tags, declare resource limits,
      and not mount a service-account token.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: amcart
  # Also validate Deployments, StatefulSets, etc. so a bad manifest is refused at `kubectl apply`
  # time, instead of silently producing a ReplicaSet that can never create its pods.
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
    - name: podRunAsNonRoot
      expression: object.spec.?securityContext.?runAsNonRoot.orValue(false)
  validations:
    - message: "R1 non-root: set securityContext.runAsNonRoot: true (pod or every container)."
      expression: >-
        variables.containers.all(c,
          c.?securityContext.?runAsNonRoot.orValue(variables.podRunAsNonRoot) == true)

    - message: "R2 no privilege escalation: set securityContext.allowPrivilegeEscalation: false on every container."
      expression: >-
        variables.containers.all(c,
          c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)

    - message: "R3 capabilities: every container must drop ALL capabilities and add none."
      expression: >-
        variables.containers.all(c,
          c.?securityContext.?capabilities.?drop.orValue([]).exists(x, x == 'ALL')
          && c.?securityContext.?capabilities.?add.orValue([]).size() == 0)

    - message: "R4 read-only root filesystem: set securityContext.readOnlyRootFilesystem: true (mount an emptyDir for writable paths)."
      expression: >-
        variables.containers.all(c,
          c.?securityContext.?readOnlyRootFilesystem.orValue(false) == true)

    - message: "R5 image tag: images must be pinned to an explicit tag or digest, never ':latest' or untagged."
      expression: >-
        variables.containers.all(c,
          !c.image.endsWith(':latest')
          && (c.image.contains('@')
              || c.image.substring(c.image.lastIndexOf('/') + 1).contains(':')))

    - message: "R6 resources: every container must declare cpu and memory limits and a memory request."
      expression: >-
        object.spec.containers.all(c,
          c.?resources.?limits.?cpu.hasValue()
          && c.?resources.?limits.?memory.hasValue()
          && c.?resources.?requests.?memory.hasValue())

    - message: "R7 service account token: set automountServiceAccountToken: false (the app does not call the Kubernetes API)."
      expression: object.spec.?automountServiceAccountToken.orValue(true) == false
