# Nginx site config for single-EC2 Docker Compose.
# Upstreams use Docker Compose service names on the amcart network.

upstream user_service {
    least_conn;
    keepalive 32;
    server user-service:8080 max_fails=3 fail_timeout=30s;
}

upstream product_service {
    least_conn;
    keepalive 32;
    server product-service:8080 max_fails=3 fail_timeout=30s;
}

# Redirect HTTP to HTTPS.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS application server.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/x-javascript;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.unsplash.com; connect-src 'self'; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # ProductService
    location ^~ /api/v1/products {
        limit_req zone=api_general burst=20 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_pass http://product_service;
    }
    location ^~ /api/v1/brands {
        limit_req zone=api_general burst=20 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_pass http://product_service;
    }
    location ^~ /api/v1/categories {
        limit_req zone=api_general burst=20 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_pass http://product_service;
    }
    location ^~ /api/v1/orders {
        limit_req zone=api_general burst=20 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_pass http://product_service;
    }
    location ^~ /api/v1/checkout {
        limit_req zone=api_general burst=20 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_pass http://product_service;
    }
    location ^~ /api/v1/cart {
        limit_req zone=api_general burst=20 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_pass http://product_service;
    }
    location ^~ /api/v1/wishlist {
        limit_req zone=api_general burst=20 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_pass http://product_service;
    }

    # UserService
    location /api/v1/auth/login {
        limit_req zone=api_auth burst=5 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_pass http://user_service;
    }
    location /api/v1/auth/register {
        limit_req zone=api_auth burst=5 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_pass http://user_service;
    }
    location /api/v1/auth/forgot-password {
        limit_req zone=api_auth burst=3 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_pass http://user_service;
    }
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_pass http://user_service;
    }

    location /health {
        include /etc/nginx/snippets/proxy-api.conf;
        proxy_pass http://user_service/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
