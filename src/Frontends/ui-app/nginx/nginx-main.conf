# Main nginx config for the UI container image.
# Runs as an unprivileged user (UID 101) on a read-only root filesystem:
# everything nginx writes at runtime goes to /tmp (a tmpfs / emptyDir).
worker_processes    auto;
error_log           /dev/stderr warn;
pid                 /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens  off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Section 4.7: one JSON line per request, with the correlation ID nginx generates ($request_id)
    # and forwards to the services as X-Correlation-ID (snippets/proxy-api.conf).
    # "path" is $uri, WITHOUT the query string: C7, query strings carry single-use tokens
    # (e.g. /api/v1/auth/verify-email?token=...) that must never reach the logs.
    log_format json escape=json
        '{"time":"$time_iso8601","Event":"http.access","CorrelationId":"$request_id",'
        '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"duration_s":$request_time,"upstream":"$upstream_addr","upstream_s":"$upstream_response_time",'
        '"client":"$remote_addr","user_agent":"$http_user_agent"}';
    # Kubernetes probes hit /healthz every few seconds: no security value, kept out of the logs.
    map $uri $loggable {
        /healthz 0;
        default  1;
    }
    access_log /dev/stdout json if=$loggable;

    sendfile        on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    client_max_body_size        1m;
    client_body_timeout         12s;
    client_header_timeout       12s;

    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
    limit_req_status 503;

    include /etc/nginx/conf.d/*.conf;
}
