# Extra secret rules for `trivy image` (same intent as .gitleaks.toml),
# so a secret baked into an image fails the build even if it was never in Git.
rules:
  - id: db-connection-string-password
    category: general
    title: Password inside a database connection string
    severity: CRITICAL
    regex: (?i)(?:host|server|data source)=[^"\n]*?;\s*password=(?P<secret>[^;"'\s]+)
    secret-group-name: secret
    keywords:
      - password=
  - id: jwt-signing-secret
    category: general
    title: JWT signing secret in configuration
    severity: CRITICAL
    regex: (?i)"secret"\s*:\s*"(?P<secret>[^"\s]{16,})"
    secret-group-name: secret
    keywords:
      - secret
